# KREA 2 IDENTITY EDIT — reference-driven outfit / identity editing. Consumable by apply_manifest.
#
# Two images in, one out: a PRIMARY reference (the person to keep) and a SECONDARY
# reference (the clothing/appearance to apply). Krea2EditGroundedEncode grounds the edit
# on both, so the face, pose and background survive while the named element changes.
#
# Sources are the CANONICAL upstreams, not a third-party mirror: Comfy-Org/Krea-2 for the
# base model + VAE/encoder, and the LoRA author's own repo. The Aitrepreneur mirror the
# other krea2 packs use does NOT carry krea2_turbo_fp8_scaled (404 — verified), and the
# workflow names that exact file.
#
# Needs native ComfyUI KREA 2 support (CLIPLoader type=krea2).

pip: []

custom_nodes:
  # Krea2EditGroundedEncode + Krea2EditModelPatch. The ONLY custom pack this needs —
  # ResolutionSelector is core ComfyUI (comfy_extras.nodes_resolution), verified against
  # a live /object_info rather than assumed from the node name.
  - https://github.com/lbouaraba/comfyui-krea2edit

models:
  # --- Diffusion model (krea2_turbo, fp8_scaled) ---
  - url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/diffusion_models/krea2_turbo_fp8_scaled.safetensors
    local_path: diffusion_models/krea2_turbo_fp8_scaled.safetensors

  # --- Text encoder (Qwen3-VL 4B, fp8_scaled) — CLIPLoader type=krea2 ---
  - url: https://huggingface.co/Aitrepreneur/FLX/resolve/main/qwen3vl_4b_fp8_scaled.safetensors
    local_path: text_encoders/qwen3vl_4b_fp8_scaled.safetensors

  # --- VAE (Qwen image VAE) ---
  - url: https://huggingface.co/Aitrepreneur/FLX/resolve/main/qwen_image_vae.safetensors
    local_path: vae/qwen_image_vae.safetensors

  # --- Identity Edit LoRA v1.2 ---
  #     The workflow loads it as `Krea2/krea2_identity_edit_v1_2.safetensors`, so it MUST
  #     land in the Krea2/ subfolder — a flat loras/ install leaves the LoraLoaderModelOnly
  #     pointing at a file that is present but unfindable.
  #     r64 / r128 rank variants exist in the same repo if you want a smaller download.
  - url: https://huggingface.co/conradlocke/krea2-identity-edit/resolve/main/krea2_identity_edit_v1_2.safetensors
    local_path: loras/Krea2/krea2_identity_edit_v1_2.safetensors
