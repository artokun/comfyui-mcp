# Optional reverse proxy: publish :3000 and forward to ComfyUI on :3001.
#
# Only used when start.sh runs with USE_NGINX=1. This mirrors the verified
# live-pod pattern (nginx :3000 -> ComfyUI :3001). If you instead publish
# ComfyUI's port directly on the RunPod template, you do NOT need this file —
# leave USE_NGINX=0.
#
# The critical bits for ComfyUI specifically: WebSocket upgrade (progress
# events), unlimited body size (model/image uploads), and long timeouts
# (generations + Manager installs can run for minutes).

worker_processes auto;
events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ComfyUI uploads (images, models pushed via Manager) can be large.
    client_max_body_size 0;

    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;

            # WebSocket (live progress / queue updates)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-running generations / Manager installs.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
