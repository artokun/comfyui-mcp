; comfyui-mcp Manager v2 seed config  (ComfyUI/user/__manager/config.ini)
; -----------------------------------------------------------------------------
; REQUIRED for the comfyui-mcp Agent Panel to install models/nodes remotely.
;
;   network_mode = personal_cloud
;       The /v2 install-model security gate only permits remote installs in
;       personal_cloud mode. Do NOT leave this at the default or remote installs
;       are rejected.
;
;   security_level = normal-
;       Safe default for remote installs: lets the panel queue node/model
;       installs while still blocking the riskiest operations.
;       Set to "weak" for the MOST permissive behavior (no install guardrails) —
;       only on a pod you fully trust/control. Override at runtime with the
;       COMFY_SECURITY_LEVEL env (re-asserted by /post_start.sh).
;
; This file is baked into the seed at /opt/ComfyUI and copied to
; /workspace/ComfyUI on first boot. /post_start.sh re-asserts these two keys at
; boot in case rsync -u skipped the seed on a pre-existing volume (see README
; "warm-volume caveat").
[default]
network_mode = personal_cloud
security_level = normal-
